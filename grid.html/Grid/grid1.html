<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0%;
        }

        .container {
            display: grid;
            grid-template-rows: 20% 1fr 10%;
            grid-template-columns: 15% 1fr 1fr;
            min-height: 950px;
            width: auto;
            grid-template-areas:
                "header header header"
                "sidebar main main"
                "footer footer footer";
        }

        header {
            grid-area: header;
            background-color: #496E4C;
        }

        aside {
            grid-area: sidebar;
            background-color: #A3B18A;
        }

        main {
            grid-area: main;
            background-color: #dad7cd;
        }

        footer {
            grid-area: footer;
            background-color: #588157;
        }
    </style>
</head>

<body class="container">
    <header></header>
    <aside></aside>
    <main></main>
    <footer></footer>
</body>

</html>
